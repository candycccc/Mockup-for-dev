[data-platform=android] .nav button.active {color:var(--red2);font-weight:600}
[data-platform=android] .nav button.active .icon {stroke-width:2.1}
[data-platform=android] .platform-home-indicator {background:#fff}
[data-platform=android] .platform-home-indicator span {width:100px;height:4px}
[data-platform=android] .btn {border-radius:22px;min-height:48px;padding:0 18px;font-size:14px}
[data-platform=android] .sheet {border-radius:24px 24px 0 0;padding:12px 22px 22px}
[data-platform=android] .sheet-actions {justify-content:flex-end;padding-top:14px;gap:8px}
[data-platform=android] .sheet-actions .btn:not(.primary):not(.danger) {border:0;background:none;color:var(--red2)}
[data-platform=android] .field input,[data-platform=android] .field select,[data-platform=android] .field textarea {border-radius:4px;border-color:#92979e}
[data-platform=android] .field label {font-size:13px}
[data-platform=android] .fab {border-radius:16px;bottom:98px;background:var(--red2);box-shadow:0 2px 5px #0002}
[data-platform=android] .platform-alert {border-radius:24px}
[data-platform=android] .platform-alert-actions {flex-wrap:wrap}
[data-platform=android] .picker-options button {flex-direction:row-reverse;justify-content:flex-end}
[data-platform=android] .picker-options button i {border:2px solid #878c94;border-radius:50%;height:20px;width:20px;font-size:11px}
[data-platform=android] .picker-options button[aria-checked=true] i {border-color:var(--red2)}
[data-platform=android] button { -webkit-tap-highlight-color:#ff465528 }
.embedded {background:transparent}
.embedded .platform-preview-tools {width:100%;margin:0 0 8px;padding:0 6px;min-height:40px}
.embedded .platform-preview-tools>div,.embedded .platform-preview-tools details {display:none}
.embedded .platform-preview-tools button {margin-left:auto;padding:7px 10px;font-size:11px}
.embedded .stage {padding:0;background:transparent}
.embedded .app {width:100%;height:calc(100dvh - 48px);max-height:none;box-shadow:none}
@media(max-width:520px){
  .stage {padding:0}
  .app {width:100%;height:calc(100dvh - 96px);border-radius:0!important;border:0}
  .platform-preview-tools {margin:10px 12px;width:calc(100% - 24px);gap:6px;font-size:10px}
  .platform-preview-tools>div {gap:6px}
  .platform-preview-tools>div span {font-size:10px}
  .platform-preview-tools strong {font-size:14px}
  .platform-preview-tools details {font-size:10px}
  .platform-preview-tools button {font-size:11px}
  .embedded .app {border:1px solid #d2d6db;border-radius:22px!important}
  .embedded .platform-preview-tools {width:100%;margin:0 0 8px}
  .top {padding-top:4px!important}
}
@media(prefers-reduced-motion:reduce){* {scroll-behavior:auto!important;transition:none!important;animation:none!important}}

[data-platform=ios] .attention-tabs {padding:0;border-bottom:0}
[data-platform=ios] .attention-tabs .seg {display:flex;margin:10px 16px;padding:3px}
.embedded,.embedded .platform-preview-tools {background:#edf0f2}

</style>

<style id="priority-call-emphasis">

 html[data-platform] .app .home-priority-call {padding:12px 10px;grid-template-columns:34px minmax(0,1fr) auto;column-gap:9px}

    function navBar(){if(['deal','lead','search'].includes(state.view))return'';const count=attention.filter(a=>a.scope==='my'&&!a.done).length,priority=callTasks.filter(c=>c.owner==='You'&&c.priority&&!c.done).length;return `<nav class="nav" aria-label="CRM navigation">${[['home','home','Home'],['calls','phone','Calls'],['attention','bell','Follow-ups'],['deals','deal','Deals'],['leads','user','Leads']].map(([v,i,l])=>`<button class="${(state.view===v||(state.view==='deal'&&v==='deals')||(state.view==='lead'&&v==='leads'))?'active':''}" data-action="nav" data-view="${v}"><span class="nav-icon">${icon(i)}${v==='calls'&&priority?`<b class="badge-count">${priority}</b>`:v==='attention'&&count?`<b class="badge-count">${count}</b>`:''}</span><span class="nav-label">${l}</span></button>`).join('')}</nav>`}
    function shell(head,body,fab='',modal=''){app.innerHTML=`${head}<main class="content">${body}</main>${navBar()}${fab}${modal}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}`}
    function stageTone(d){if(d.stage==='Won')return'green';if(d.stage==='Lost')return'red';if(d.required.length)return'red';if(d.stage==='Passed Review')return'green';if(d.stage==='In Progress')return'amber';return''}
    function dealStatus(d){if(d.required.length)return d.required[0].due+' · '+d.required[0].text;if(d.stage==='Won')return d.quotes[0]?.no?'Winning Quote '+d.quotes[0].no:'Won · Agreed with customer';if(d.stage==='Lost')return'All live Quotes cancelled';return d.quotes[0]?.meta||'No linked Quote'}
    // Desktop: margin comes from linked Quote figures; manual estimates have no margin.
    function dealMarginValue(deal){
      const value=deal.margin;
      return deal.quotes?.length&&value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value))?Number(value):null;
    }
    function showDealMargin(deal){return PERMS.canSeeCosts&&dealMarginValue(deal)!==null}
    function dealMarginTotal(rows){
      const values=rows.map(dealMarginValue).filter(value=>value!==null);
      return values.length?values.reduce((sum,value)=>sum+value,0):null;
    }
    function compareDealMargin(a,b){
      const left=dealMarginValue(a),right=dealMarginValue(b);
      return left===null?(right===null?0:1):right===null?-1:right-left;
    }

    document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(!['auth-resend','auth-expire-preview','auth-reset-submit'].includes(action))return;e.preventDefault();e.stopImmediatePropagation();if(action==='auth-resend'){state.authMode='twofactor';render();toast('A new email code was sent')}else if(action==='auth-expire-preview'){state.authMode='twofactor-expired';render()}else if(action==='auth-reset-submit'){const email=document.getElementById('reset-email')?.value.trim();if(!email){showFieldError('reset-email','Enter your email address');return}state.authMode='reset-sent';render()}},true);


    function updateVisibleDealSummary(rows=filteredDeals()){
      const summary=document.querySelector('.summary-strip'),margin=dealMarginTotal(rows);
      if(summary)summary.innerHTML=`<strong>${rows.length} Deal${rows.length===1?'':'s'}</strong><i>·</i>${money(rows.reduce((n,d)=>n+d.value,0))} value${PERMS.canSeeCosts&&margin!==null?`<i>·</i>${money(margin)} margin`:''}`;
      const page=document.querySelector('.pagination-note');if(page)page.textContent=rows.length+' sample Deal'+(rows.length===1?'':'s');
    }
    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-action="review-outstanding"]');if(!b)return;
      e.preventDefault();e.stopImmediatePropagation();state.modal=null;state.dealTab='activity';setHashForState();
    },true);

/* Shared overlay exit lifecycle for this local browser prototype. */
(() => {
  let closing = false;
  window.crmSheetMotion = {
    get closing() { return closing; },
    dismiss(panel, shade, finish) {
      if (closing) return;
      if (!panel || matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
      closing = true;
      panel.setAttribute('aria-busy', 'true');
      const inert = panel.inert;
      panel.inert = true;
      panel.style.animation = 'none';
      const from = getComputedStyle(panel).transform;
      const motion = panel.animate([
        { transform: from === 'none' ? 'translateY(0)' : from },
        { transform: panel.classList.contains('account-drawer') ? 'translateX(-105%)' : 'translateY(calc(100% + 32px))' }
      ], { duration: 200, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      const fade = shade?.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
      let finished = false;
      const complete = () => {
        if (finished) return;
        finished = true; clearTimeout(fallback);
        closing = false; panel.inert = inert; panel.removeAttribute('aria-busy');
        finish();
        motion.cancel(); fade?.cancel();
      };
      const fallback = setTimeout(complete, 280);
      motion.finished.then(complete, complete);
    }
  };
  // Repeated taps and Escape cannot dismiss the parent while its child is leaving.
  for (const type of ['click', 'pointerdown', 'keydown']) window.addEventListener(type, event => {
    if (!closing) return;
    event.preventDefault(); event.stopImmediatePropagation();
  }, true);
})();

  }
