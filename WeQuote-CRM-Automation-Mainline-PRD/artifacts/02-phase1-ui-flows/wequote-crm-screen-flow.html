          { title: 'Resolve overlap', breadcrumb: 'CRM / Automations / Activation check', route: 'automations', render: () => `<section class="wq-preview"><header class="wq-preview-head"><div><span class="wq-pill warn">ACTIVATION CHECK</span><h2>Resolve one overlapping policy</h2><p>Two Active Automations must not create the same follow-up for the same Los Angeles Quote.</p></div><button class="wq-primary">Apply safe scope</button></header><div class="wq-preview-tabs"><button class="wq-tab active">Scope comparison</button><button class="wq-tab">Affected Deals</button><button class="wq-tab">Timeline</button></div><div class="wq-before-after"><article><small>BEFORE · OVERLAP</small><h3>Global Sent follow-up</h3><p>Scope: All Companies, including Los Angeles.<br>Wait: 7 working days.</p><span class="wq-pill warn" style="margin-top:9px">Matches LA Quote</span></article><div class="wq-preview-arrow">＋</div><article><small>NEW · COMPANY-SPECIFIC</small><h3>LA fast Sent follow-up</h3><p>Scope: Los Angeles only.<br>Wait: 3 working days.</p><span class="wq-pill warn" style="margin-top:9px">Also matches LA Quote</span></article></div><div class="wq-guidance" style="margin:0 14px 10px"><span class="wq-new-tag">BLOCK ACTIVATION</span><span><strong>Recommended safe fix:</strong> change the global Automation scope to “All Companies except Los Angeles”. The LA policy then owns LA records without duplicate Notes.</span></div><div class="wq-before-after" style="padding-top:0"><article class="after"><small>GLOBAL POLICY · SAFE</small><h3>All Companies except Los Angeles</h3><p>Orange County, Northern California, Palm Desert and future included Companies use the 7-day policy.</p><span class="wq-pill success" style="margin-top:9px">No LA overlap</span></article><div class="wq-preview-arrow">＋</div><article class="after"><small>LA POLICY · SAFE</small><h3>Los Angeles only</h3><p>LA uses the faster 3-day follow-up. The Automation can now be turned on.</p><span class="wq-pill success" style="margin-top:9px">No duplicate run</span></article></div></section>` },
          { title: 'Scoped Automations', breadcrumb: 'CRM / Automations / Sales Pipeline', route: 'automations', render: () => `<div class="wq-toolbar"><div class="wq-toolbar-left"><button class="wq-secondary">← Pipelines</button><div><strong style="font-size:12px">Automations for Sales Pipeline</strong><small style="display:block;color:#7d8999;font-size:8px;margin-top:3px">Global policy and Company-specific override are visible together.</small></div></div><div class="wq-toolbar-right"><select class="wq-select"><option>All Company scopes</option><option>Los Angeles</option><option>Orange County</option></select><button class="wq-primary">+ Create automation</button></div></div><div class="wq-guidance"><span class="wq-new-tag">SAFE SCOPES</span><span>Exact scopes are shown on every row. History can be filtered by Company; turning off the LA policy never stops the protected Quote lifecycle.</span></div><div class="wq-aut-list"><article class="wq-aut-row"><div><span class="wq-aut-icon">S</span><div><strong>Sent Quote follow-up</strong><small>Sent · 7 working days · global baseline</small></div></div><div><span class="wq-pill">All except Los Angeles</span></div><span class="wq-pill success">Active</span><div class="wq-aut-actions"><button class="wq-secondary">Preview</button><button class="wq-secondary">Edit</button><button class="wq-switch on" aria-label="Active"></button></div></article><article class="wq-aut-row"><div><span class="wq-aut-icon">LA</span><div><strong>LA fast Sent follow-up</strong><small>Sent · 3 working days · Company-specific</small></div></div><div><span class="wq-pill company">Los Angeles only</span></div><span class="wq-pill success">Active</span><div class="wq-aut-actions"><button class="wq-secondary">Preview</button><button class="wq-secondary">Edit</button><button class="wq-switch on" aria-label="Active"></button></div></article><article class="wq-aut-row"><div><span class="wq-aut-icon">Q</span><div><strong>Quote build & SOW checks</strong><small>In Progress · standard Organisation policy</small></div></div><div><span class="wq-pill">All Companies</span></div><span class="wq-pill">Inactive</span><div class="wq-aut-actions"><button class="wq-secondary">Preview</button><button class="wq-secondary">Edit</button><button class="wq-switch" aria-label="Inactive"></button></div></article></div><div class="wq-guidance" style="margin-top:10px"><span class="wq-existing-tag">CURRENT WEQUOTE</span><span>Secondary Companies still provide the Quote issuer identity. The Company-aware CRM scope, access, filtering and Automation enrolment shown here are proposed new functionality.</span></div>` }
        ]
      }
    };

    let currentFlow = 'lead';
    let currentStep = 0;

    function render() {
      const flow = flows[currentFlow];
      const step = flow.steps[currentStep];
      flowKicker.textContent = flow.kicker;
      flowTitle.textContent = flow.title;
      title.textContent = step.title;
      breadcrumb.textContent = step.breadcrumb;
      stepCount.textContent = `${currentStep + 1} / ${flow.steps.length}`;
      screen.innerHTML = step.render();
      root.querySelectorAll('[data-route]').forEach(button => button.classList.toggle('active', button.dataset.route === step.route));
      root.querySelectorAll('[data-flow]').forEach(button => {
        const active = button.dataset.flow === currentFlow;
        button.classList.toggle('btn-primary', active);
      });
      dots.innerHTML = flow.steps.map((_, index) => `<button type="button" aria-label="Step ${index + 1}" data-step="${index}" class="${index === currentStep ? 'active' : ''}"></button>`).join('');
      prev.disabled = currentStep === 0;
      next.disabled = currentStep === flow.steps.length - 1;
    }

    root.querySelectorAll('[data-flow]').forEach(button => button.addEventListener('click', () => {
      currentFlow = button.dataset.flow;
      currentStep = 0;
      render();
    }));
    dots.addEventListener('click', event => {
      const button = event.target.closest('[data-step]');
      if (!button) return;
      currentStep = Number(button.dataset.step);
      render();
    });
    prev.addEventListener('click', () => { if (currentStep > 0) { currentStep -= 1; render(); } });
    next.addEventListener('click', () => { if (currentStep < flows[currentFlow].steps.length - 1) { currentStep += 1; render(); } });
    render();
  })();
</script>
