    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;wq-top&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;Automation options for Custom Pipelines and Custom Stages&lt;/h2&gt;
      &lt;p&gt;Choose the Pipeline type first. This decides which triggers, rules, actions and Stage moves are available.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Pipeline type&quot;&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-wq-mode=&quot;standalone&quot; aria-pressed=&quot;false&quot;&gt;Fully Custom Pipeline&lt;/button&gt;
      &lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; data-wq-mode=&quot;quote&quot; aria-pressed=&quot;true&quot;&gt;Pipeline with Quote Lifecycle&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;wq-mode-status&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;Showing Pipeline with Quote Lifecycle options&lt;/div&gt;

  &lt;section data-wq-panel=&quot;standalone&quot; hidden&gt;
    &lt;div class=&quot;wq-mode-intro&quot;&gt;&lt;i data-lucide=&quot;workflow&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Fully Custom Pipeline · the customer controls every Stage&lt;/strong&gt;&lt;span&gt;There are no system-owned stages such as Qualified, Sent or Won. The customer chooses every Stage name, order and movement rule.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;wq-lane&quot; role=&quot;img&quot; aria-label=&quot;Example fully custom pipeline with customer controlled stages&quot;&gt;
      &lt;div class=&quot;wq-lane-item&quot;&gt;&lt;small&gt;Customer stage&lt;/small&gt;&lt;strong&gt;New opportunity&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-lane-item&quot;&gt;&lt;small&gt;Customer stage&lt;/small&gt;&lt;strong&gt;Discovery&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-lane-item&quot;&gt;&lt;small&gt;Customer stage&lt;/small&gt;&lt;strong&gt;Site survey&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-lane-item&quot;&gt;&lt;small&gt;Customer stage&lt;/small&gt;&lt;strong&gt;Proposal&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-lane-item&quot;&gt;&lt;small&gt;Customer outcome&lt;/small&gt;&lt;strong&gt;Closed&lt;/strong&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wq-catalog&quot;&gt;
      &lt;section class=&quot;wq-column&quot;&gt;
        &lt;h3&gt;Starts when&lt;/h3&gt;
        &lt;p&gt;Choose the event that starts the Automation. Then choose whether it runs once or can run again.&lt;/p&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Deal and Stage events&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;A Deal is created&lt;/li&gt;&lt;li&gt;A Deal enters or leaves a selected Stage&lt;/li&gt;&lt;li&gt;A Deal moves from one selected Stage to another&lt;/li&gt;&lt;li&gt;The Deal Owner changes&lt;/li&gt;&lt;li&gt;A Watcher, Label or Interest changes&lt;/li&gt;&lt;li&gt;Deal Value, Margin or Expected Close Date changes&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;CRM Activity events&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;A Next Action becomes due, overdue or completed&lt;/li&gt;&lt;li&gt;A Note follow-up becomes due or completed&lt;/li&gt;&lt;li&gt;A Meeting or Site Visit is scheduled, starts, completes or is cancelled&lt;/li&gt;&lt;li&gt;A file is uploaded or removed&lt;/li&gt;&lt;li&gt;A requested file is received&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Time and inactivity&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;A Deal stays in a Stage for a set number of days&lt;/li&gt;&lt;li&gt;There has been no activity for a set number of days&lt;/li&gt;&lt;li&gt;The Expected Close Date is approaching&lt;/li&gt;&lt;li&gt;A selected date or time is reached&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Optional Quote events&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;A Quote is created, edited, sent, viewed or accepted&lt;/li&gt;&lt;li&gt;A Quote expiry date is approaching&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;wq-important&quot;&gt;These options appear only when related Quote data is enabled. A Quote event does not move the Deal unless an Action does it.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-column rule&quot;&gt;
        &lt;h3&gt;Rules&lt;/h3&gt;
        &lt;p&gt;Each rule creates a Yes and No path. Multiple rules can be joined with AND or OR.&lt;/p&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Pipeline position&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal is in a selected Stage&lt;/li&gt;&lt;li&gt;The Deal came from a selected Stage&lt;/li&gt;&lt;li&gt;The Deal has stayed in this Stage for a set time&lt;/li&gt;&lt;li&gt;This Automation has or has not run before&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Deal data&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Owner is set or matches a selected person&lt;/li&gt;&lt;li&gt;A Watcher, Label or Interest is present or missing&lt;/li&gt;&lt;li&gt;Value or Margin is above or below an amount&lt;/li&gt;&lt;li&gt;Expected Close Date is before or after a date&lt;/li&gt;&lt;li&gt;Owning Company matches the Automation scope&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Activities and files&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;An open Next Action exists, is missing or is overdue&lt;/li&gt;&lt;li&gt;Recent activity exists or is missing&lt;/li&gt;&lt;li&gt;A Meeting or Site Visit has a selected status&lt;/li&gt;&lt;li&gt;An open Note follow-up exists&lt;/li&gt;&lt;li&gt;A required file exists or is missing&lt;/li&gt;&lt;li&gt;An open file request exists&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Optional Quote data&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Quote status, viewed status or expiry date&lt;/li&gt;&lt;li&gt;An accepted Quote exists&lt;/li&gt;&lt;li&gt;Pricing or Scope of Work is complete&lt;/li&gt;&lt;li&gt;Number of viable related Quotes&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-column action&quot;&gt;
        &lt;h3&gt;Actions&lt;/h3&gt;
        &lt;p&gt;The key difference: in a Fully Custom Pipeline, an Automation can move a Deal between Custom Stages.&lt;/p&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Stage control&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;wq-important&quot;&gt;Move the Deal to another Custom Stage&lt;/span&gt;&lt;/li&gt;&lt;li&gt;End this path safely&lt;/li&gt;&lt;li&gt;Return to an earlier Automation step in a controlled loop&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Deal work&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Assign a specific Deal Owner&lt;/li&gt;&lt;li&gt;Set or clear the Deal Next Action&lt;/li&gt;&lt;li&gt;Add or remove a Deal Watcher&lt;/li&gt;&lt;li&gt;Create a Note&lt;/li&gt;&lt;li&gt;Schedule a Meeting or Site Visit&lt;/li&gt;&lt;li&gt;Send an internal notification&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Data and files&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Add or remove a Deal Label&lt;/li&gt;&lt;li&gt;Add or remove an Interest&lt;/li&gt;&lt;li&gt;Set the Expected Close Date&lt;/li&gt;&lt;li&gt;Request a file&lt;/li&gt;&lt;li&gt;Attach a file to the Deal&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-option-group&quot;&gt;&lt;h4&gt;Optional Quote actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Create a related Quote&lt;/li&gt;&lt;li&gt;Add a Quote Label&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;wq-important&quot;&gt;Creating, sending or accepting a Quote does not change the Custom Stage unless a separate Automation Action moves the Deal.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wq-policy&quot;&gt;
      &lt;div&gt;&lt;strong&gt;Safe Stage moves&lt;/strong&gt;&lt;span&gt;A Move Deal Action can only use a Stage in the same Pipeline. WeQuote warns about loops or repeated runs before publishing.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Required work&lt;/strong&gt;&lt;span&gt;A file request, Note or Next Action can be required. The Automation waits for completion before its next step.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;No hidden lifecycle&lt;/strong&gt;&lt;span&gt;WeQuote does not assume Qualified, Sent, Won or Lost. The customer defines what every Stage means.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section data-wq-panel=&quot;quote&quot;&gt;
    &lt;div class=&quot;wq-mode-intro&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Pipeline with Quote Lifecycle · protected milestones with optional Custom Stages&lt;/strong&gt;&lt;span&gt;The customer can add Custom Stages between protected milestones. They cannot rename, remove or reorder protected milestones, and an Automation cannot fake a Quote lifecycle event.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;wq-quote-rail&quot; role=&quot;img&quot; aria-label=&quot;Protected quote lifecycle with allowed Custom Stage insertion points between milestones&quot;&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Protected entry&lt;/small&gt;&lt;strong&gt;Qualified&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Quote created&lt;/small&gt;&lt;strong&gt;In Progress&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Conditional&lt;/small&gt;&lt;strong&gt;In Review&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Conditional&lt;/small&gt;&lt;strong&gt;Passed Review&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Quote issued&lt;/small&gt;&lt;strong&gt;Sent&lt;/strong&gt;&lt;/div&gt;
      &lt;div class=&quot;wq-protected&quot;&gt;&lt;small&gt;Final outcome&lt;/small&gt;&lt;strong&gt;Won or Lost&lt;/strong&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wq-forbidden&quot;&gt;
      &lt;div&gt;&lt;strong&gt;Before Qualified · not allowed&lt;/strong&gt;Pre-qualification belongs in the Lead workflow or a separate Fully Custom Pipeline. Qualified remains the fixed entry point for a Quote-connected Deal.&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;After Won or Lost · not allowed&lt;/strong&gt;Won and Lost are final Sales outcomes. Delivery, Billing and Project handover should use a Won Automation instead of adding more Sales Stages.&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wq-segments&quot;&gt;
      &lt;h3&gt;Options for every Custom Stage position&lt;/h3&gt;
      &lt;p&gt;Each block below shows the full set of practical choices for a Custom Stage added at that point in the Quote lifecycle.&lt;/p&gt;

      &lt;section class=&quot;wq-segment&quot; aria-labelledby=&quot;wq-segment-1&quot;&gt;
        &lt;div class=&quot;wq-segment-head&quot;&gt;&lt;span class=&quot;wq-segment-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;small&gt;Custom Stage position&lt;/small&gt;&lt;h3 id=&quot;wq-segment-1&quot;&gt;Between Qualified and In Progress&lt;/h3&gt;&lt;p&gt;Use this section for discovery, site readiness and work that must happen before the first Quote.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-segment-grid&quot;&gt;
          &lt;div class=&quot;wq-segment-column&quot;&gt;&lt;h4&gt;Starts when&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal enters this Custom Stage&lt;/li&gt;&lt;li&gt;The Deal Owner changes&lt;/li&gt;&lt;li&gt;A Next Action becomes due, overdue or completed&lt;/li&gt;&lt;li&gt;A Meeting or Site Visit is scheduled, starts or completes&lt;/li&gt;&lt;li&gt;A file is uploaded or a requested file is received&lt;/li&gt;&lt;li&gt;The Deal has no activity for a set number of days&lt;/li&gt;&lt;li&gt;The Expected Close Date is approaching&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column rule&quot;&gt;&lt;h4&gt;Rules&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal is still in this Custom Stage&lt;/li&gt;&lt;li&gt;No related Quote exists yet&lt;/li&gt;&lt;li&gt;The Owner or Next Action is missing&lt;/li&gt;&lt;li&gt;Site or customer information is incomplete&lt;/li&gt;&lt;li&gt;The Site Visit has not been completed&lt;/li&gt;&lt;li&gt;A required plan or file is missing&lt;/li&gt;&lt;li&gt;An open file request exists&lt;/li&gt;&lt;li&gt;Label, Interest, Value, Company or Expected Close matches&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column action&quot;&gt;&lt;h4&gt;Actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Assign the Deal Owner&lt;/li&gt;&lt;li&gt;Set or clear the Next Action&lt;/li&gt;&lt;li&gt;Create a Note or schedule a Meeting / Site Visit&lt;/li&gt;&lt;li&gt;Add or remove a Watcher, Label or Interest&lt;/li&gt;&lt;li&gt;Request a file or attach a file to the Deal&lt;/li&gt;&lt;li&gt;Set the Expected Close Date&lt;/li&gt;&lt;li&gt;Create the first related Quote&lt;/li&gt;&lt;li&gt;Move to another Custom Stage in this same section&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wq-segment-result&quot;&gt;&lt;div&gt;&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;What moves the Deal forward&lt;/strong&gt;Creating the first related Quote moves the Deal to protected In Progress.&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;&lt;span class=&quot;wq-yes&quot;&gt;Required checkpoint allowed&lt;/span&gt;&lt;/strong&gt;Selected work can be required before the first Quote is created.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-segment&quot; aria-labelledby=&quot;wq-segment-2&quot;&gt;
        &lt;div class=&quot;wq-segment-head&quot;&gt;&lt;span class=&quot;wq-segment-number&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;small&gt;Custom Stage position&lt;/small&gt;&lt;h3 id=&quot;wq-segment-2&quot;&gt;Between In Progress and In Review / Sent&lt;/h3&gt;&lt;p&gt;Use this section while the Quote is being built, priced and prepared for review or sending.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-segment-grid&quot;&gt;
          &lt;div class=&quot;wq-segment-column&quot;&gt;&lt;h4&gt;Starts when&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal enters this Custom Stage&lt;/li&gt;&lt;li&gt;The first related Quote is created&lt;/li&gt;&lt;li&gt;A Quote is edited&lt;/li&gt;&lt;li&gt;Products, pricing or Scope of Work changes&lt;/li&gt;&lt;li&gt;A Quote or Deal file is added&lt;/li&gt;&lt;li&gt;A Note follow-up or Next Action becomes due&lt;/li&gt;&lt;li&gt;A Meeting / Site Visit changes&lt;/li&gt;&lt;li&gt;The Deal has no activity for a set number of days&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column rule&quot;&gt;&lt;h4&gt;Rules&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Quote is still Draft / In Progress&lt;/li&gt;&lt;li&gt;Pricing or Scope of Work is complete or incomplete&lt;/li&gt;&lt;li&gt;Quote Review is enabled or disabled&lt;/li&gt;&lt;li&gt;A technical file or reviewer is missing&lt;/li&gt;&lt;li&gt;An open build or technical Note exists&lt;/li&gt;&lt;li&gt;A required file is missing&lt;/li&gt;&lt;li&gt;No open Next Action or recent activity exists&lt;/li&gt;&lt;li&gt;Value, Margin, discount, Label or Interest matches&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column action&quot;&gt;&lt;h4&gt;Actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Create a build or review Note&lt;/li&gt;&lt;li&gt;Set or clear the Next Action&lt;/li&gt;&lt;li&gt;Assign the Deal Owner or add a reviewer as Watcher&lt;/li&gt;&lt;li&gt;Request or attach a technical file&lt;/li&gt;&lt;li&gt;Add or remove a Deal Label or Interest&lt;/li&gt;&lt;li&gt;Add a Quote Label&lt;/li&gt;&lt;li&gt;Set the Expected Close Date&lt;/li&gt;&lt;li&gt;Send an internal notification&lt;/li&gt;&lt;li&gt;Move to another Custom Stage in this same section&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wq-segment-result&quot;&gt;&lt;div&gt;&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;What moves the Deal forward&lt;/strong&gt;Submit for Review moves it to In Review. If Review is off, sending the Quote moves it to Sent.&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;&lt;span class=&quot;wq-yes&quot;&gt;Required checkpoint allowed&lt;/span&gt;&lt;/strong&gt;Selected work can be required before Submit for Review or Send.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-segment&quot; aria-labelledby=&quot;wq-segment-3&quot;&gt;
        &lt;div class=&quot;wq-segment-head&quot;&gt;&lt;span class=&quot;wq-segment-number&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;small&gt;Custom Stage position&lt;/small&gt;&lt;h3 id=&quot;wq-segment-3&quot;&gt;Between In Review and Passed Review&lt;/h3&gt;&lt;p&gt;Use this section for technical review work, missing information and approval follow-up.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-segment-grid&quot;&gt;
          &lt;div class=&quot;wq-segment-column&quot;&gt;&lt;h4&gt;Starts when&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal enters this Custom Stage&lt;/li&gt;&lt;li&gt;The Quote is submitted for review&lt;/li&gt;&lt;li&gt;The reviewer or Deal Owner changes&lt;/li&gt;&lt;li&gt;A review Note changes or becomes due&lt;/li&gt;&lt;li&gt;A technical file is uploaded&lt;/li&gt;&lt;li&gt;A requested file is received&lt;/li&gt;&lt;li&gt;A Next Action becomes due&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column rule&quot;&gt;&lt;h4&gt;Rules&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Quote is still In Review&lt;/li&gt;&lt;li&gt;An open technical review Note exists&lt;/li&gt;&lt;li&gt;A required reviewer or approval is missing&lt;/li&gt;&lt;li&gt;A required technical file is missing&lt;/li&gt;&lt;li&gt;All review checks are complete&lt;/li&gt;&lt;li&gt;Value or discount needs additional approval&lt;/li&gt;&lt;li&gt;No open Next Action exists&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column action&quot;&gt;&lt;h4&gt;Actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Create a technical review Note&lt;/li&gt;&lt;li&gt;Set the Next Action&lt;/li&gt;&lt;li&gt;Assign the Deal Owner or add a reviewer as Watcher&lt;/li&gt;&lt;li&gt;Request or attach a technical file&lt;/li&gt;&lt;li&gt;Add or remove a Deal Label&lt;/li&gt;&lt;li&gt;Add a Quote Label&lt;/li&gt;&lt;li&gt;Send an internal notification&lt;/li&gt;&lt;li&gt;Move to another Custom Stage in this same section&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;wq-no&quot;&gt;Cannot approve the Quote as an Automation Action&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wq-segment-result&quot;&gt;&lt;div&gt;&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;What moves the Deal forward&lt;/strong&gt;A reviewer passes the Quote → Passed Review. Changes requested → In Progress.&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;&lt;span class=&quot;wq-yes&quot;&gt;Required checkpoint allowed&lt;/span&gt;&lt;/strong&gt;Selected review work can be required before the reviewer passes the Quote.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-segment&quot; aria-labelledby=&quot;wq-segment-4&quot;&gt;
        &lt;div class=&quot;wq-segment-head&quot;&gt;&lt;span class=&quot;wq-segment-number&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;small&gt;Custom Stage position&lt;/small&gt;&lt;h3 id=&quot;wq-segment-4&quot;&gt;Between Passed Review and Sent&lt;/h3&gt;&lt;p&gt;Use this section for final commercial checks and customer-facing documents before sending.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-segment-grid&quot;&gt;
          &lt;div class=&quot;wq-segment-column&quot;&gt;&lt;h4&gt;Starts when&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal enters this Custom Stage&lt;/li&gt;&lt;li&gt;The Quote passes internal review&lt;/li&gt;&lt;li&gt;The Quote is edited after review&lt;/li&gt;&lt;li&gt;A final file is added&lt;/li&gt;&lt;li&gt;A Next Action or Note follow-up becomes due&lt;/li&gt;&lt;li&gt;The Expected Close Date is approaching&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column rule&quot;&gt;&lt;h4&gt;Rules&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Quote is still in Passed Review&lt;/li&gt;&lt;li&gt;The Quote is viable&lt;/li&gt;&lt;li&gt;Customer-facing content is complete&lt;/li&gt;&lt;li&gt;Recipient details and expiry date are complete&lt;/li&gt;&lt;li&gt;Commercial approval is complete&lt;/li&gt;&lt;li&gt;A final document is missing&lt;/li&gt;&lt;li&gt;Value, Margin or discount matches an approval rule&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column action&quot;&gt;&lt;h4&gt;Actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Create a ready-to-send Note&lt;/li&gt;&lt;li&gt;Set the customer follow-up Next Action&lt;/li&gt;&lt;li&gt;Schedule a Meeting&lt;/li&gt;&lt;li&gt;Add an approver as Watcher&lt;/li&gt;&lt;li&gt;Add or remove a Deal Label or Interest&lt;/li&gt;&lt;li&gt;Attach a final document&lt;/li&gt;&lt;li&gt;Add a Quote Label&lt;/li&gt;&lt;li&gt;Set the Expected Close Date&lt;/li&gt;&lt;li&gt;Send an internal notification&lt;/li&gt;&lt;li&gt;Move to another Custom Stage in this same section&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wq-segment-result&quot;&gt;&lt;div&gt;&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;What moves the Deal forward&lt;/strong&gt;Issuing the Quote to the customer moves the Deal to protected Sent.&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;&lt;span class=&quot;wq-yes&quot;&gt;Required checkpoint allowed&lt;/span&gt;&lt;/strong&gt;Selected final checks can be required before the Quote is sent.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wq-segment&quot; aria-labelledby=&quot;wq-segment-5&quot;&gt;
        &lt;div class=&quot;wq-segment-head&quot;&gt;&lt;span class=&quot;wq-segment-number&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;small&gt;Custom Stage position&lt;/small&gt;&lt;h3 id=&quot;wq-segment-5&quot;&gt;Between Sent and Won / Lost&lt;/h3&gt;&lt;p&gt;Use this section for customer engagement, follow-up, expiry and commercial close-out.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wq-segment-grid&quot;&gt;
          &lt;div class=&quot;wq-segment-column&quot;&gt;&lt;h4&gt;Starts when&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The Deal enters this Custom Stage&lt;/li&gt;&lt;li&gt;A Quote is sent&lt;/li&gt;&lt;li&gt;The customer views a Quote&lt;/li&gt;&lt;li&gt;A Quote expiry date is approaching&lt;/li&gt;&lt;li&gt;A Quote is accepted or cancelled&lt;/li&gt;&lt;li&gt;A Next Action or Note follow-up becomes due&lt;/li&gt;&lt;li&gt;The Deal has no activity for a set number of days&lt;/li&gt;&lt;li&gt;A customer or commercial file is added&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column rule&quot;&gt;&lt;h4&gt;Rules&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;A Quote is still Sent, viable and not accepted&lt;/li&gt;&lt;li&gt;Number of related Quotes viewed by the customer&lt;/li&gt;&lt;li&gt;No accepted Quote exists&lt;/li&gt;&lt;li&gt;No recent activity or open Next Action exists&lt;/li&gt;&lt;li&gt;The latest Quote expiry date has passed&lt;/li&gt;&lt;li&gt;No viable related Quote remains&lt;/li&gt;&lt;li&gt;All related Quotes are cancelled&lt;/li&gt;&lt;li&gt;Value, Label, Interest or Expected Close matches&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
          &lt;div class=&quot;wq-segment-column action&quot;&gt;&lt;h4&gt;Actions&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Set or clear the customer follow-up Next Action&lt;/li&gt;&lt;li&gt;Create a Note or schedule a Meeting&lt;/li&gt;&lt;li&gt;Assign the Deal Owner or add a Watcher&lt;/li&gt;&lt;li&gt;Add or remove a Deal Label or Interest&lt;/li&gt;&lt;li&gt;Request or attach a file&lt;/li&gt;&lt;li&gt;Set the Expected Close Date&lt;/li&gt;&lt;li&gt;Send an internal notification&lt;/li&gt;&lt;li&gt;Move to another Custom Stage in this same section&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;wq-no&quot;&gt;Cannot block a customer view, acceptance or final outcome&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wq-segment-result&quot;&gt;&lt;div&gt;&lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;What moves the Deal forward&lt;/strong&gt;Accepted Quote → Won. No viable Quote → Lost. All related Quotes cancelled → Archived, not a Stage.&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;&lt;span class=&quot;wq-no&quot;&gt;Required checkpoint not allowed&lt;/span&gt;&lt;/strong&gt;Trusted customer events and protected outcomes always continue.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wq-policy&quot;&gt;
      &lt;div&gt;&lt;strong&gt;No required checkpoint&lt;/strong&gt;&lt;span&gt;When the protected Quote event happens, the Deal leaves the Custom Stage and moves to the correct protected milestone.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Required checkpoint set&lt;/strong&gt;&lt;span&gt;Only an allowed internal event can wait. The UI shows the unfinished work and what must be completed.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Trusted customer event&lt;/strong&gt;&lt;span&gt;A Quote view, customer acceptance, or the Won/Lost result can never be blocked by a Custom Stage or Automation.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (function () {
      const root = document.getElementById(&#x27;wq-custom-pipeline-options&#x27;);
      if (!root) return;
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-wq-mode]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[data-wq-panel]&#x27;));
      const status = root.querySelector(&#x27;#wq-mode-status&#x27;);
      buttons.forEach(function (button) {
        button.addEventListener(&#x27;click&#x27;, function () {
          const mode = button.dataset.wqMode;
          buttons.forEach(function (item) {
            const active = item.dataset.wqMode === mode;
            item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          panels.forEach(function (panel) { panel.hidden = panel.dataset.wqPanel !== mode; });
          if (status) status.textContent = mode === &#x27;quote&#x27; ? &#x27;Showing Pipeline with Quote Lifecycle options&#x27; : &#x27;Showing Fully Custom Pipeline options&#x27;;
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
